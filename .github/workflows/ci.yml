name: CI

# Runs the checks from docs/agents/commands.md (CI). Public repository: standard runners, macOS included, are free.
# The macOS job runs only when scripts/ci-scope.sh says App/, BreathnestKit/ or project.yml changed, on a pull request
# and on a push to main alike. It is skipped with a job-level `if`, not a workflow-level `paths:` filter: a skipped job
# counts as passed for a required check, a filtered workflow leaves the check pending.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scripts:
    name: Script tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: scripts/test-pr-facts.sh
      - run: scripts/test-block-dangerous-git.sh
      - run: scripts/test-stop-check.sh
      # The repo rules of `make lint`, here too so they fail in seconds on a cheap runner.
      - run: scripts/test-check-workflows.sh
      - run: scripts/test-check-docs.sh
      - run: scripts/test-check-architecture.sh
      - run: scripts/test-check-catalogs.sh
      - run: scripts/test-check-tools.sh
      - run: scripts/test-ci-scope.sh
      - run: scripts/test-check-review.sh
      - run: scripts/check-workflows.sh
      - run: scripts/check-docs.sh
      - run: scripts/check-architecture.sh
      # test-githooks.sh runs the real scanner of the pre-commit hook. The version is the one of tools.env, the download
      # is checked against the published checksums.
      - name: Install gitleaks (version of tools.env)
        run: |
          source tools.env
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL "$base/$archive" -o "$RUNNER_TEMP/$archive"
          curl -fsSL "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt" -o "$RUNNER_TEMP/gitleaks-checksums.txt"
          (cd "$RUNNER_TEMP" && grep " $archive\$" gitleaks-checksums.txt | sha256sum -c -)
          mkdir -p "$RUNNER_TEMP/gitleaks"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/gitleaks" gitleaks
          echo "$RUNNER_TEMP/gitleaks" >> "$GITHUB_PATH"
      - run: scripts/test-githooks.sh

  # Says whether the macOS job below is needed. Runs on every event so that `ios` always has an answer.
  changes:
    name: Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      swift: ${{ steps.scope.outputs.swift }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # Pull request: the base branch. Push to main: the previous tip (`before`), so a squash-merged PR is one diff.
      # A manual run has neither, then everything runs. An all-zero `before` (new branch) does the same in the script.
      - id: scope
        env:
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          base="$BEFORE_SHA"
          if [ -n "$BASE_REF" ]; then base="origin/$BASE_REF"; fi
          scripts/ci-scope.sh "$base" >> "$GITHUB_OUTPUT"

  # The Kit is Foundation only, so its tests run on Linux in the official Swift image and never wait for a macOS runner.
  # The tag is the Swift of Package.swift (swift-tools-version 6.2), the digest makes it immutable. Bump both together.
  kit:
    name: Kit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container: swift:6.2-noble@sha256:e508ef1e4be68087f720de622b91cbf1e32799a7aa96134b35e6f1a1d656db7a
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: swift --version
      # Runs `swift test` with coverage and puts the line coverage of the Kit sources in the job summary. A report, no limit.
      - run: scripts/coverage.sh

  # `needs.changes.outputs.swift != 'false'` also runs the job when `changes` failed: a job skipped because of a failed
  # `needs` would count as passed for the required check.
  ios:
    name: Build, app tests, lint
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.swift != 'false' }}
    # macos-26, not macos-latest: the image decides which Xcode and Simulator runtimes exist, so it does not move under us.
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # CI_XCODE_VERSION of tools.env. The step fails when the image no longer has that Xcode, so a new image is a visible
      # change of this file, not a silent one.
      - name: Select Xcode
        run: |
          source tools.env
          xcode="/Applications/Xcode_${CI_XCODE_VERSION}.app"
          if [ ! -d "$xcode" ]; then
            echo "$xcode is not on this runner image. Installed:" >&2
            ls -d /Applications/Xcode_*.app >&2
            exit 1
          fi
          sudo xcode-select -s "$xcode"
      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
          xcrun simctl list runtimes
      # macOS ships Make 3.81, so the pipefail setting of the Makefile is tested here, not on ubuntu.
      - run: scripts/test-make-pipefail.sh
      # The Brewfile installs the unpinned tools. swiftformat and swiftlint come from scripts/install-tools.sh at the versions
      # of tools.env, the same ones `make lint` checks for locally: the runner's Homebrew copies are newer, and their extra
      # rules fail `make lint` on files nobody touched. Bump the pins in tools.env together with the local install.
      - name: Install tools
        run: |
          brew bundle
          scripts/install-tools.sh
          echo "$PWD/.tools/bin" >> "$GITHUB_PATH"
      - run: swiftformat --version
      - run: swiftlint --version
      - run: scripts/test-swiftlint-rules.sh
      - run: make gen build test lint
      - name: Screenshot
        run: make run screenshot
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: screenshot
          path: build/screenshot.png
          if-no-files-found: ignore
