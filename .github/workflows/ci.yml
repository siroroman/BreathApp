name: CI

# Runs the checks from docs/agents/commands.md. Public repository: standard runners, macOS included, are free.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  SWIFTFORMAT_VERSION: "0.51.13"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scripts:
    name: Script tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: scripts/test-pr-facts.sh
      - run: scripts/test-block-dangerous-git.sh
      - run: scripts/test-githooks.sh

  kit:
    name: Kit tests
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
      # macOS ships Make 3.81, so the pipefail setting of the Makefile is tested here, not on ubuntu.
      - run: scripts/test-make-pipefail.sh
      - run: make test-kit

  ios:
    name: Build, app tests, lint
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Toolchain
        run: |
          xcodebuild -version
          xcrun simctl list runtimes
      - name: Install tools
        run: brew install xcodegen xcbeautify
      # Pinned: the runner's Homebrew swiftformat is newer than the one the code is formatted with, and
      # its extra rules fail `make lint` on files nobody touched. Bump it together with the local install.
      - name: Install swiftformat ${{ env.SWIFTFORMAT_VERSION }}
        run: |
          curl -fsSL "https://github.com/nicklockwood/SwiftFormat/releases/download/${SWIFTFORMAT_VERSION}/swiftformat.zip" -o "$RUNNER_TEMP/swiftformat.zip"
          mkdir -p "$RUNNER_TEMP/swiftformat"
          unzip -q "$RUNNER_TEMP/swiftformat.zip" -d "$RUNNER_TEMP/swiftformat"
          chmod +x "$RUNNER_TEMP/swiftformat/swiftformat"
          echo "$RUNNER_TEMP/swiftformat" >> "$GITHUB_PATH"
      - run: swiftformat --version
      - run: make gen build test lint
      - name: Screenshot
        run: make run screenshot
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: screenshot
          path: build/screenshot.png
          if-no-files-found: ignore
