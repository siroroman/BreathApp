name: CI

# Runs the checks from docs/agents/commands.md. Public repository: standard runners, macOS included, are free.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scripts:
    name: Script tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: scripts/test-pr-facts.sh
      - run: scripts/test-block-dangerous-git.sh

  kit:
    name: Kit tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
      - run: make test-kit

  ios:
    name: Build, app tests, lint
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          xcodebuild -version
          xcrun simctl list runtimes
      - name: Install tools
        run: brew install xcodegen xcbeautify swiftformat
      - run: make gen build test lint
      - name: Screenshot
        run: make run screenshot
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshot
          path: build/screenshot.png
          if-no-files-found: ignore
