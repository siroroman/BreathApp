name: Breathnest
options:
  bundleIdPrefix: com.siroroman
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    TARGETED_DEVICE_FAMILY: "1"
    DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
packages:
  BreathnestKit:
    path: BreathnestKit
schemes:
  Breathnest:
    build:
      targets:
        Breathnest: all
    test:
      targets:
        - BreathnestTests
  # UI tests have their own scheme, so `make test-app` and `make test` do not run them. `make test-ui` does.
  BreathnestUI:
    build:
      targets:
        Breathnest: all
        BreathnestUITests: [test]
    test:
      targets:
        - BreathnestUITests
targets:
  Breathnest:
    type: application
    platform: iOS
    sources:
      - App/Breathnest
    dependencies:
      - package: BreathnestKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.siroroman.breathnest
        PRODUCT_NAME: Breathnest
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: Breathnest
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
  BreathnestTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - App/BreathnestTests
    dependencies:
      - target: Breathnest
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.siroroman.breathnest.tests
        GENERATE_INFOPLIST_FILE: YES
  BreathnestUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - App/BreathnestUITests
    dependencies:
      - target: Breathnest
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.siroroman.breathnest.uitests
        GENERATE_INFOPLIST_FILE: YES
