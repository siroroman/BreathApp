<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>New exercise, dark</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
.t-dark{--bg:#000000;--fg:#E9F0F6;--fg2:#A7B6C4;--track:#2B3E53;--outline:#5E7389;--ring:#5CC7D6;--surface:#121F2E;--line:#22344A;--scrim:#04080D}
.fld{display:block;width:100%;box-sizing:border-box;margin:0;border:1.5px solid var(--outline);border-radius:14px;background:var(--surface);color:var(--fg);font:inherit;resize:none}
.fld::placeholder{color:var(--fg2);opacity:1}
</style>
</helmet>
<div class="{{themeClass}}" style="width: 390px; height: {{rootH}}px; box-sizing: border-box; background: var(--scrim); padding-top: 44px; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', system-ui, sans-serif">
<div style="height: 100%; box-sizing: border-box; background: var(--bg); color: var(--fg); border-radius: 38px 38px 0 0; padding: 10px 20px 36px; display: flex; flex-direction: column; gap: {{s.gap}}px; overflow: hidden">
<div style="align-self: center; width: 36px; height: 5px; border-radius: 3px; background: var(--outline)"></div>
<div style="display: flex; justify-content: flex-start">
<button style="min-height: 44px; padding: 0; border: 0; background: transparent; color: var(--ring); font: inherit; font-size: {{s.cancel}}px; font-weight: 500">Cancel</button>
</div>
<h1 style="margin: 0; font-size: {{s.title}}px; font-weight: 700; line-height: 1.15; letter-spacing: -0.02em">New exercise</h1>
<label style="display: block">
<span style="display: block; margin: 0 0 8px; font-size: {{s.label}}px; font-weight: 600; color: var(--fg2); line-height: 1.3">Name</span>
<input class="fld" type="text" value="Evening calm" placeholder="Name your exercise" style="min-height: {{s.fieldH}}px; padding: 0 16px; font-size: {{s.field}}px">
</label>
<section>
<h2 style="margin: 0 0 8px; font-size: {{s.label}}px; font-weight: 600; color: var(--fg2); line-height: 1.3">Icon</h2>
<div role="group" aria-label="Icon" style="display: flex; flex-wrap: wrap; gap: 10px">
<sc-for list="{{icons}}" as="ic" hint-placeholder-count="6">
<button aria-pressed="{{ic.pressed}}" aria-label="{{ic.label}}" style="display: flex; align-items: center; justify-content: center; width: {{s.iconBox}}px; height: {{s.iconBox}}px; padding: 0; border-radius: 14px; border: {{ic.bw}}px solid {{ic.border}}; background: var(--surface); color: {{ic.color}}">
<svg viewBox="0 0 24 24" aria-hidden="true" style="width: {{s.iconGlyph}}px; height: {{s.iconGlyph}}px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round">
<path d="{{ic.d}}"></path>
</svg>
</button>
</sc-for>
</div>
</section>
<label style="display: block">
<span style="display: block; margin: 0 0 8px; font-size: {{s.label}}px; font-weight: 600; color: var(--fg2); line-height: 1.3">Description</span>
<textarea class="fld" rows="2" placeholder="What is it for?" style="min-height: {{s.descH}}px; padding: 12px 16px; font-size: {{s.field}}px; line-height: 1.35">A slow wind-down before sleep.</textarea>
</label>
<section>
<div style="display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; column-gap: 12px; margin: 0 0 8px">
<h2 style="margin: 0; font-size: {{s.label}}px; font-weight: 600; color: var(--fg2); line-height: 1.3">Pattern, in seconds</h2>
<p aria-live="polite" style="margin: 0; font-size: {{s.label}}px; font-weight: 600; line-height: 1.3; font-variant-numeric: tabular-nums">{{summary}}</p>
</div>
<div style="background: var(--surface); border-radius: 16px; overflow: hidden">
<sc-for list="{{rows}}" as="r" hint-placeholder-count="4">
<div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; box-sizing: border-box; min-height: {{s.rowH}}px; padding: 0 8px 0 16px; border-top: {{r.bt}}; font-size: {{s.field}}px; font-weight: 500">
<span>{{r.name}}</span>
<span style="display: flex; align-items: center">
<button aria-label="{{r.minusLabel}}" aria-disabled="{{r.minDis}}" style="display: flex; align-items: center; justify-content: center; width: {{s.stepBox}}px; height: {{s.stepBox}}px; padding: 0; border: 0; background: transparent; color: var(--ring); opacity: {{r.minOp}}">
<svg viewBox="0 0 24 24" aria-hidden="true" style="width: {{s.stepGlyph}}px; height: {{s.stepGlyph}}px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round">
<path d="M6 12 H18"></path>
</svg>
</button>
<span style="min-width: {{s.valW}}px; text-align: center; font-weight: 600; font-variant-numeric: tabular-nums">{{r.value}}</span>
<button aria-label="{{r.plusLabel}}" style="display: flex; align-items: center; justify-content: center; width: {{s.stepBox}}px; height: {{s.stepBox}}px; padding: 0; border: 0; background: transparent; color: var(--ring)">
<svg viewBox="0 0 24 24" aria-hidden="true" style="width: {{s.stepGlyph}}px; height: {{s.stepGlyph}}px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round">
<path d="M12 6 V18 M6 12 H18"></path>
</svg>
</button>
</span>
</div>
</sc-for>
</div>
</section>
<button style="margin-top: auto; width: 100%; min-height: {{s.btnH}}px; border: 0; border-radius: 999px; background: var(--fg); color: var(--bg); font: inherit; font-size: {{s.btnF}}px; font-weight: 600">Add exercise</button>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"ax":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const pr = this.props;
const theme = 'dark';
const ax = pr.ax === true || pr.ax === 'true';
const s = ax
? { gap: 22, cancel: 38, title: 52, label: 34, field: 38, fieldH: 84, descH: 150, iconBox: 88, iconGlyph: 48, rowH: 88, stepBox: 88, stepGlyph: 40, valW: 110, btnH: 96, btnF: 44 }
: { gap: 12, cancel: 17, title: 30, label: 15, field: 17, fieldH: 48, descH: 68, iconBox: 48, iconGlyph: 26, rowH: 48, stepBox: 44, stepGlyph: 24, valW: 52, btnH: 54, btnF: 19 };
const glyphs = [
['Ring', 'M12 4 A8 8 0 1 1 11.99 4 Z M12 10 A2 2 0 1 1 11.99 10 Z'],
['Moon', 'M20 14.5 A8 8 0 1 1 9.5 4 A6.5 6.5 0 0 0 20 14.5 Z'],
['Sun', 'M12 8 A4 4 0 1 1 11.99 8 Z M12 2 V4 M12 20 V22 M2 12 H4 M20 12 H22 M4.9 4.9 L6.3 6.3 M17.7 17.7 L19.1 19.1 M4.9 19.1 L6.3 17.7 M17.7 6.3 L19.1 4.9'],
['Leaf', 'M5 19 C5 10 10 5 19 5 C19 14 14 19 5 19 Z M5 19 L13 11'],
['Wave', 'M2 9 C4.5 6 7 6 9.5 9 S14.5 12 17 9 S20 7.5 22 8 M2 16 C4.5 13 7 13 9.5 16 S14.5 19 17 16 S20 14.5 22 15'],
['Wind', 'M3 8 H14 A3 3 0 1 0 11 5 M3 12 H19 A3 3 0 1 1 16 15 M3 16 H10']
];
const sel = 0;
const icons = glyphs.map((g, i) => ({
label: g[0],
d: g[1],
pressed: i === sel,
bw: i === sel ? 2.5 : 1.5,
border: i === sel ? 'var(--ring)' : 'var(--outline)',
color: i === sel ? 'var(--ring)' : 'var(--fg2)'
}));
const names = ['Inhale', 'Hold', 'Exhale', 'Hold'];
const mins = [1, 0, 1, 0];
const vals = [4, 2, 6, 0];
const rows = names.map((n, i) => ({
name: n,
value: vals[i] + ' s',
minusLabel: 'Decrease ' + n.toLowerCase() + (i === 3 ? ' after exhale' : i === 1 ? ' after inhale' : ''),
plusLabel: 'Increase ' + n.toLowerCase() + (i === 3 ? ' after exhale' : i === 1 ? ' after inhale' : ''),
minDis: vals[i] <= mins[i],
minOp: vals[i] <= mins[i] ? 0.4 : 1,
bt: i === 0 ? 'none' : '1px solid var(--line)'
}));
const total = vals.reduce((a, b) => a + b, 0);
return {
themeClass: 't-' + theme,
rootH: ax ? 2300 : 844,
s: s,
icons: icons,
rows: rows,
summary: total + ' s per cycle'
};
}
}
</script>
</body>
</html>
