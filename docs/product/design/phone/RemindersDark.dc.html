<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Reminder, dark</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
.t-dark{--bg:#000000;--fg:#E9F0F6;--fg2:#A7B6C4;--track:#2B3E53;--outline:#5E7389;--ring:#5CC7D6;--surface:#121F2E;--line:#22344A}
.sw{appearance:none;-webkit-appearance:none;position:relative;flex:none;width:52px;height:32px;margin:0;border-radius:999px;background:var(--outline);transform-origin:right center}
.sw:checked{background:var(--ring)}
.sw::after{content:'';position:absolute;top:2px;left:2px;width:28px;height:28px;border-radius:50%;background:#FFFFFF}
.sw:checked::after{left:22px}
</style>
</helmet>
<main class="{{themeClass}}" style="position: relative; width: 390px; height: {{rootH}}px; box-sizing: border-box; background: var(--bg); color: var(--fg); font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', system-ui, sans-serif; padding: 64px 16px 34px; overflow: hidden">
<div role="group" aria-label="Section" style="display: flex; gap: 4px; padding: 4px; margin-bottom: 24px; background: var(--surface); border-radius: 999px">
<button aria-pressed="false" style="flex: 1; min-height: {{s.segH}}px; border: 0; border-radius: 999px; background: transparent; color: var(--fg); font: inherit; font-size: {{s.seg}}px; font-weight: 500">Stats</button>
<button aria-pressed="true" style="flex: 1; min-height: {{s.segH}}px; border: 0; border-radius: 999px; background: var(--fg); color: var(--bg); font: inherit; font-size: {{s.seg}}px; font-weight: 600">Reminder</button>
</div>
<p style="margin: 0 4px 16px; font-size: {{s.note}}px; color: var(--fg2); line-height: 1.4">A quiet nudge to take a few breaths at the times you choose.</p>
<ul style="list-style: none; margin: 0 0 16px; padding: 0; background: var(--surface); border-radius: 20px; overflow: hidden">
<sc-for list="{{rows}}" as="r" hint-placeholder-count="3">
<li style="border-top: {{r.bt}}">
<label style="display: flex; flex-direction: column; gap: {{s.dayGap}}px; box-sizing: border-box; padding: {{s.rowPad}}px 16px">
<span style="display: flex; align-items: center; justify-content: space-between; gap: 12px">
<span style="display: flex; flex-direction: column; gap: 2px; min-width: 0">
<span style="font-size: {{s.time}}px; font-weight: 600; line-height: 1.15; font-variant-numeric: tabular-nums; color: {{r.color}}">{{r.time}}</span>
<span style="font-size: {{s.sub}}px; color: var(--fg2); line-height: 1.3">{{r.sub}}</span>
</span>
<sc-if value="{{r.on}}" hint-placeholder-val="{{ true }}">
<input class="sw" type="checkbox" role="switch" checked aria-label="{{r.label}}" style="transform: scale({{s.swScale}})">
</sc-if>
<sc-if value="{{r.off}}" hint-placeholder-val="{{ false }}">
<input class="sw" type="checkbox" role="switch" aria-label="{{r.label}}" style="transform: scale({{s.swScale}})">
</sc-if>
</span>
<span role="img" aria-label="{{r.repeat}}" style="display: flex; gap: {{s.dayGap}}px; opacity: {{r.dayOp}}">
<sc-for list="{{r.days}}" as="d" hint-placeholder-count="7">
<span aria-hidden="true" style="display: flex; align-items: center; justify-content: center; width: {{s.dayBox}}px; height: {{s.dayBox}}px; box-sizing: border-box; border-radius: 999px; border: 1.5px solid {{d.border}}; background: {{d.bg}}; color: {{d.color}}; font-size: {{s.day}}px; font-weight: 600">{{d.letter}}</span>
</sc-for>
</span>
</label>
</li>
</sc-for>
</ul>
<div style="margin-bottom: 16px; background: var(--surface); border-radius: 20px; overflow: hidden">
<button style="display: flex; align-items: center; gap: 12px; width: 100%; box-sizing: border-box; min-height: {{s.addH}}px; padding: 0 16px; border: 0; background: transparent; color: var(--ring); font: inherit; font-size: {{s.row}}px; font-weight: 600; text-align: left">
<svg viewBox="0 0 24 24" aria-hidden="true" style="flex: none; width: {{s.plus}}px; height: {{s.plus}}px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round">
<path d="M12 5 V19 M5 12 H19"></path>
</svg>
<span>Add reminder</span>
</button>
</div>
<p style="margin: 0 4px; font-size: {{s.foot}}px; color: var(--fg2); line-height: 1.4">Reminders arrive as notifications. You can turn them off for Breathnest in the iOS Settings app.</p>
<nav aria-label="Main" style="position: absolute; left: 0; right: 0; bottom: 0; box-sizing: border-box; height: {{s.tabH}}px; padding: 8px 16px 34px; display: flex; border-top: 1px solid var(--line); background: var(--bg)">
<button aria-current="{{tab.exCur}}" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; padding: 0; border: 0; background: transparent; color: {{tab.exColor}}; font: inherit; font-size: {{s.tabLabel}}px; font-weight: {{tab.exW}}">
<svg viewBox="0 0 24 24" aria-hidden="true" style="width: {{s.tabIcon}}px; height: {{s.tabIcon}}px; fill: none; stroke: currentColor; stroke-width: {{tab.exSw}}; stroke-linecap: round; stroke-linejoin: round">
<path d="M12 3 A9 9 0 1 1 11.99 3 Z M12 9.5 A2.5 2.5 0 1 1 11.99 9.5 Z"></path>
</svg>
<span>Exercises</span>
</button>
<button aria-current="{{tab.stCur}}" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; padding: 0; border: 0; background: transparent; color: {{tab.stColor}}; font: inherit; font-size: {{s.tabLabel}}px; font-weight: {{tab.stW}}">
<svg viewBox="0 0 24 24" aria-hidden="true" style="width: {{s.tabIcon}}px; height: {{s.tabIcon}}px; fill: none; stroke: currentColor; stroke-width: {{tab.stSw}}; stroke-linecap: round; stroke-linejoin: round">
<path d="M5 20 V12 M12 20 V5 M19 20 V9"></path>
</svg>
<span>Stats</span>
</button>
</nav>
</main>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"ax":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const pr = this.props;
const theme = 'dark';
const ax = pr.ax === true || pr.ax === 'true';
const s = ax
? { segH: 84, seg: 36, note: 34, rowPad: 18, time: 48, sub: 32, row: 40, addH: 88, plus: 40, foot: 30, swScale: 1.5, dayBox: 44, day: 24, dayGap: 12, tabH: 150, tabLabel: 30, tabIcon: 40 }
: { segH: 40, seg: 15, note: 15, rowPad: 12, time: 26, sub: 14, row: 17, addH: 52, plus: 22, foot: 13, swScale: 1, dayBox: 30, day: 13, dayGap: 8, tabH: 88, tabLabel: 11, tabIcon: 26 };
const line = '1px solid var(--line)';
const letters = ['M', 'T', 'W', 'T', 'F', 'S', 'S'];
const names = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday'];
const data = [
{ time: '7:30 AM', sub: 'Coherent breathing', on: true, sel: [1, 1, 1, 1, 1, 1, 1], repeat: 'Every day' },
{ time: '1:00 PM', sub: 'Box breathing', on: true, sel: [1, 1, 1, 1, 1, 0, 0], repeat: 'Weekdays' },
{ time: '10:00 PM', sub: '4-7-8', on: false, sel: [0, 0, 0, 0, 0, 1, 1], repeat: 'Weekends' }
];
const rows = data.map((d, i) => ({
time: d.time,
sub: d.sub,
on: d.on,
off: !d.on,
label: d.time + ', ' + d.sub,
repeat: d.repeat + ': ' + names.filter((n, k) => d.sel[k]).join(', '),
dayOp: d.on ? 1 : 0.75,
days: letters.map((l, k) => ({
letter: l,
bg: d.sel[k] ? 'var(--fg)' : 'transparent',
color: d.sel[k] ? 'var(--bg)' : 'var(--fg2)',
border: d.sel[k] ? 'var(--fg)' : 'var(--outline)'
})),
color: d.on ? 'var(--fg)' : 'var(--fg2)',
bt: i === 0 ? 'none' : line
}));
const tab = { exCur: 'false', stCur: 'page', exColor: 'var(--fg2)', stColor: 'var(--ring)', exW: 500, stW: 700, exSw: 1.8, stSw: 2.4 };
return { themeClass: 't-' + theme, rootH: ax ? 1900 : 844, s: s, tab: tab, rows: rows };
}
}
</script>
</body>
</html>
