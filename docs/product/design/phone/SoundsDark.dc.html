<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sound menu, dark</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
.t-dark{--pop:#1B2C42;--bg:#000000;--fg:#E9F0F6;--fg2:#A7B6C4;--track:#2B3E53;--outline:#5E7389;--ring:#5CC7D6;--surface:#121F2E;--line:#22344A;--scrim:#04080D}
.sw{appearance:none;-webkit-appearance:none;position:relative;flex:none;width:52px;height:32px;margin:0;border-radius:999px;background:var(--outline);transform-origin:right center}
.sw:checked{background:var(--ring)}
.sw::after{content:'';position:absolute;top:2px;left:2px;width:28px;height:28px;border-radius:50%;background:#FFFFFF}
.sw:checked::after{left:22px}
.rng{-webkit-appearance:none;appearance:none;width:100%;height:44px;margin:0;background:transparent}
.rng::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:var(--outline)}
.rng::-moz-range-track{height:6px;border-radius:3px;background:var(--outline)}
.rng::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:28px;height:28px;margin-top:-11px;border-radius:50%;background:var(--ring);border:3px solid var(--bg);box-shadow:0 0 0 1.5px var(--ring)}
.rng::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:var(--ring);border:3px solid var(--bg);box-shadow:0 0 0 1.5px var(--ring)}
.rng-lg{height:72px}
.rng-lg::-webkit-slider-runnable-track{height:10px;border-radius:5px}
.rng-lg::-webkit-slider-thumb{width:44px;height:44px;margin-top:-17px}
.rng-lg::-moz-range-track{height:10px;border-radius:5px}
.rng-lg::-moz-range-thumb{width:38px;height:38px}
</style>
</helmet>
<div class="{{themeClass}}" style="width: 390px; height: {{rootH}}px; box-sizing: border-box; background: var(--scrim); padding-top: 44px; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', system-ui, sans-serif">
<div style="height: 100%; box-sizing: border-box; background: var(--bg); color: var(--fg); border-radius: 38px 38px 0 0; padding: 10px 20px 36px; display: flex; flex-direction: column; gap: {{s.gap}}px; overflow: hidden">
<div style="align-self: center; width: 36px; height: 5px; border-radius: 3px; background: var(--outline)"></div>
<div style="display: flex; justify-content: flex-start">
<button style="min-height: 44px; padding: 0; border: 0; background: transparent; color: var(--ring); font: inherit; font-size: {{s.cancel}}px; font-weight: 500">{{t.cancel}}</button>
</div>
<div>
<h1 style="margin: 0; font-size: {{s.title}}px; font-weight: 700; line-height: 1.15; letter-spacing: -0.02em">{{t.title}}</h1>
<p style="margin: 6px 0 0; font-size: {{s.pattern}}px; color: var(--fg2); line-height: 1.35">{{t.pattern}}</p>
<p style="margin: 10px 0 0; font-size: {{s.desc}}px; color: var(--fg2); line-height: 1.4">{{t.desc}}</p>
</div>
<section>
<div style="display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; column-gap: 12px; margin: 0 0 10px">
<h2 style="margin: 0; font-size: {{s.label}}px; font-weight: 600; color: var(--fg2); line-height: 1.3">{{t.dur}}</h2>
<p style="margin: 0; font-size: {{s.label}}px; font-weight: 600; line-height: 1.3; font-variant-numeric: tabular-nums">{{t.value}}</p>
</div>
<div role="group" aria-label="{{t.quick}}" style="display: flex; flex-wrap: wrap; gap: 10px">
<sc-for list="{{chips}}" as="c" hint-placeholder-count="4">
<button aria-pressed="{{c.pressed}}" style="min-height: {{s.chipH}}px; padding: 0 {{s.chipPad}}px; border-radius: 999px; border: 1.5px solid {{c.border}}; background: {{c.bg}}; color: {{c.color}}; font: inherit; font-size: {{s.chip}}px; font-weight: 600">{{c.label}}</button>
</sc-for>
</div>
<input class="{{s.rngClass}}" type="range" min="1" max="60" step="1" value="5" aria-label="{{t.slider}}" style="margin-top: 8px">
<div style="display: flex; justify-content: space-between; font-size: {{s.minmax}}px; color: var(--fg2); line-height: 1.3; font-variant-numeric: tabular-nums">
<span>{{t.min}}</span>
<span>{{t.max}}</span>
</div>
<p aria-live="polite" style="margin: 14px 0 0; font-size: {{s.result}}px; font-weight: 600; line-height: 1.25; font-variant-numeric: tabular-nums">{{t.result}}</p>
</section>
<div style="position: relative; background: var(--surface); border-radius: 16px">
<button aria-haspopup="menu" aria-expanded="true" style="display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%; box-sizing: border-box; min-height: {{s.rowH}}px; padding: {{s.rowPad}}px 16px; border: 0; background: transparent; color: var(--ring); font: inherit; font-size: {{s.haptics}}px; font-weight: 500; text-align: left">
<span>{{t.sounds}}</span>
<span style="display: flex; align-items: center; gap: 10px; color: var(--ring)">
<span>{{t.soundName}}</span>
<svg viewBox="0 0 12 20" aria-hidden="true" style="flex: none; width: {{s.chev}}px; height: {{s.chevH}}px">
<path d="M2 7.5 L6 3.5 L10 7.5 M2 12.5 L6 16.5 L10 12.5" style="fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round"></path>
</svg>
</span>
</button>
<div role="menu" aria-label="{{t.sounds}}" style="position: absolute; right: 0; top: {{s.popTop}}px; z-index: 2; width: {{s.popW}}; box-sizing: border-box; background: var(--pop); border: 1px solid var(--line); border-radius: 22px; box-shadow: 0 12px 32px rgba(0,0,0,0.55); overflow: hidden">
<sc-for list="{{sounds}}" as="so" hint-placeholder-count="5">
<button role="menuitemradio" aria-checked="{{so.checked}}" style="display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%; box-sizing: border-box; min-height: {{s.popRowH}}px; padding: 0 16px; border: 0; border-top: {{so.bt}}; background: transparent; color: {{so.color}}; font: inherit; font-size: {{s.haptics}}px; font-weight: 500; text-align: left">
<span>{{so.name}}</span>
<sc-if value="{{so.selected}}" hint-placeholder-val="{{ false }}">
<svg viewBox="0 0 24 24" aria-hidden="true" style="flex: none; width: {{s.check}}px; height: {{s.check}}px">
<path d="M4 12.5 L9.5 18 L20 6.5" style="fill: none; stroke: currentColor; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round"></path>
</svg>
</sc-if>
</button>
</sc-for>
</div>
<label style="display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: {{s.rowH}}px; box-sizing: border-box; padding: {{s.rowPad}}px 16px; border-top: 1px solid var(--line); font-size: {{s.haptics}}px; font-weight: 500">
<span>{{t.sound}}</span>
<input class="sw" type="checkbox" role="switch" checked style="transform: scale({{s.swScale}})">
</label>
<label style="display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: {{s.rowH}}px; box-sizing: border-box; padding: {{s.rowPad}}px 16px; border-top: 1px solid var(--line); font-size: {{s.haptics}}px; font-weight: 500">
<span>{{t.haptics}}</span>
<input class="sw" type="checkbox" role="switch" checked style="transform: scale({{s.swScale}})">
</label>
</div>
<button style="margin-top: auto; width: 100%; min-height: {{s.btnH}}px; border: 0; border-radius: 999px; background: var(--fg); color: var(--bg); font: inherit; font-size: {{s.btnF}}px; font-weight: 600">{{t.start}}</button>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"ax":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const pr = this.props;
const theme = 'dark';
const ax = pr.ax === true || pr.ax === 'true';
const variant = 'box-en';
const T = {
'box-en': {
cancel: 'Cancel', title: 'Box breathing', pattern: 'Inhale 4 · Hold 4 · Exhale 4 · Hold 4', dur: 'Duration', value: '5 min', quick: 'Quick options',
chips: ['1 min', '3 min', '5 min', '10 min'], sel: 2, slider: 'Custom duration in minutes', min: '1 min', max: '60 min',
result: '19 Cycles · 5:04', haptics: 'Haptics', start: 'Start',
desc: 'Four equal counts for every breath in, hold, breath out and hold. A steady, even rhythm.',
sounds: 'Sounds', soundName: 'Soft bell', sound: 'Sound'
},
'sigh-de': {
cancel: 'Abbrechen', title: 'Physiologischer Seufzer', pattern: 'Einatmen 2 · Einatmen 1 · Ausatmen 6', dur: 'Dauer', value: '5 Min.', quick: 'Schnellauswahl',
chips: ['1 Min.', '5 Min.', '10 Min.'], sel: 1, slider: 'Eigene Dauer in Minuten', min: '1 Min.', max: '60 Min.',
result: '33 Zyklen · 4:57', haptics: 'Haptik', start: 'Starten',
desc: 'Zwei kurze Atemzüge durch die Nase, dann ein langes Ausatmen.',
sounds: 'Klänge', soundName: 'Sanfte Glocke', sound: 'Ton'
}
}[variant];
const s = ax
? { gap: 22, cancel: 38, title: 52, pattern: 36, popTop: 94, popW: 'calc(100% - 24px)', popRowH: 92, check: 36, desc: 34, rowH: 88, chev: 14, chevH: 24, label: 34, chip: 38, chipH: 76, chipPad: 28, minmax: 30, rngClass: 'rng rng-lg', result: 44, rowPad: 18, haptics: 40, swScale: 1.5, btnH: 96, btnF: 44 }
: { gap: 14, cancel: 17, title: 30, pattern: 16, popTop: 50, popW: '260px', popRowH: 48, check: 20, desc: 15, rowH: 44, chev: 10, chevH: 17, label: 15, chip: 17, chipH: 44, chipPad: 20, minmax: 13, rngClass: 'rng', result: 22, rowPad: 10, haptics: 17, swScale: 1, btnH: 54, btnF: 19 };
const chips = T.chips.map((label, i) => ({
label: label,
pressed: i === T.sel,
bg: i === T.sel ? 'var(--fg)' : 'var(--surface)',
color: i === T.sel ? 'var(--bg)' : 'var(--fg)',
border: i === T.sel ? 'var(--fg)' : 'var(--outline)'
}));
return {
themeClass: 't-' + theme,
rootH: ax ? 2100 : 844,
s: s,
chips: chips,
sounds: ['Soft bell', 'Singing bowl', 'Chime', 'Wood block', 'Pulse'].map((n, i) => ({ name: n, selected: i === 0, checked: i === 0 ? 'true' : 'false', color: i === 0 ? 'var(--ring)' : 'var(--fg)', bt: i === 0 ? '0' : '1px solid var(--line)' })),
t: T
};
}
}
</script>
</body>
</html>
