<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Watch sounds</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
.w{--bg:#000000;--fg:#E9F0F6;--fg2:#A7B6C4;--ring:#5CC7D6;--surface:#14202E}
</style>
</helmet>
<main class="w" style="width: 396px; height: 484px; box-sizing: border-box; background: var(--bg); color: var(--fg); font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', system-ui, sans-serif; padding: 32px 20px 0; overflow: hidden">
<h1 style="margin: 0 10px 14px; font-size: 32px; font-weight: 600; line-height: 1.15">Sounds</h1>
<div role="radiogroup" aria-label="Sounds" style="display: flex; flex-direction: column; gap: 8px">
<sc-for list="{{items}}" as="it" hint-placeholder-count="5">
<button role="radio" aria-checked="{{it.checked}}" style="{{it.row}}">
<span style="font-size: 32px; font-weight: 600; line-height: 1.2">{{it.name}}</span>
<sc-if value="{{it.selected}}" hint-placeholder-val="{{ false }}">
<svg viewBox="0 0 24 24" aria-hidden="true" style="flex: none; width: 32px; height: 32px">
<path d="M4 12.5 L9.5 18 L20 6.5" style="fill: none; stroke: currentColor; stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round"></path>
</svg>
</sc-if>
</button>
</sc-for>
</div>
</main>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":396,"height":484}}'>
class Component extends DCLogic {
renderVals() {
const names = ['Soft bell', 'Singing bowl', 'Chime', 'Wood block', 'Pulse'];
const base = 'display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%; box-sizing: border-box; min-height: 72px; padding: 12px 20px 12px 24px; border: 0; border-radius: 28px; font: inherit; text-align: left;';
return {
items: names.map((n, i) => {
const on = i === 0;
return {
name: n,
selected: on,
checked: on ? 'true' : 'false',
row: base + (on ? ' background: var(--ring); color: #04141A;' : ' background: var(--surface); color: var(--fg);')
};
})
};
}
}
</script>
</body>
</html>
