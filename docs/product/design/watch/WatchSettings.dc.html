<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Watch settings</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
.w{--bg:#000000;--fg:#E9F0F6;--fg2:#A7B6C4;--track:#2B3E53;--outline:#5E7389;--ring:#5CC7D6;--surface:#14202E}
</style>
</helmet>
<main class="w" style="width: 396px; height: 484px; box-sizing: border-box; background: var(--bg); color: var(--fg); font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', system-ui, sans-serif; padding: 32px 20px 0; overflow: hidden">
<h1 style="margin: 0 10px 14px; font-size: 32px; font-weight: 600; line-height: 1.15">Settings</h1>
<div style="display: flex; flex-direction: column; gap: 8px">
<button style="display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%; box-sizing: border-box; min-height: 72px; padding: 12px 20px 12px 24px; border: 0; border-radius: 28px; background: var(--surface); color: var(--fg); font: inherit; text-align: left">
<span style="font-size: 32px; font-weight: 600; line-height: 1.2">Sounds</span>
<span style="display: flex; align-items: center; gap: 10px; color: var(--fg2)">
<span style="font-size: 26px; line-height: 1.2">Soft bell</span>
<svg viewBox="0 0 12 20" aria-hidden="true" style="flex: none; width: 12px; height: 20px">
<path d="M2 2 L10 10 L2 18" style="fill: none; stroke: currentColor; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round"></path>
</svg>
</span>
</button>
<button role="switch" aria-checked="true" style="display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%; box-sizing: border-box; min-height: 72px; padding: 12px 20px 12px 24px; border: 0; border-radius: 28px; background: var(--surface); color: var(--fg); font: inherit; text-align: left">
<span style="font-size: 32px; font-weight: 600; line-height: 1.2">Sound</span>
<span aria-hidden="true" style="position: relative; flex: none; width: 76px; height: 44px; border-radius: 999px; background: var(--ring)">
<span style="position: absolute; right: 4px; top: 4px; width: 36px; height: 36px; border-radius: 50%; background: #04141A"></span>
</span>
</button>
<button role="switch" aria-checked="true" style="display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%; box-sizing: border-box; min-height: 72px; padding: 12px 20px 12px 24px; border: 0; border-radius: 28px; background: var(--surface); color: var(--fg); font: inherit; text-align: left">
<span style="font-size: 32px; font-weight: 600; line-height: 1.2">Haptics</span>
<span aria-hidden="true" style="position: relative; flex: none; width: 76px; height: 44px; border-radius: 999px; background: var(--ring)">
<span style="position: absolute; right: 4px; top: 4px; width: 36px; height: 36px; border-radius: 50%; background: #04141A"></span>
</span>
</button>
</div>
</main>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":396,"height":484}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
